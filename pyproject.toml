[project]
name = "dosya-duzenleyici"
version = "0.1.0"
description = "Klasörü uzantıya veya tarihe göre otomatik düzenler"
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2", "pypdf>=4", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
duzenle = "duzenle.cli:main"

[project.gui-scripts]
aracmerkezi = "aracmerkezi.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
